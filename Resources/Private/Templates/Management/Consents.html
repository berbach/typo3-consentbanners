<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
        xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
        data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <f:flashMessages/>
    <h1><f:translate key="LLL:EXT:consent_banner/Resources/Private/Language/locallang_mod.xlf:consents.headline"/></h1>
    <f:if condition="{data.consents}">
        <f:then>
            <div class="layout-one-columns">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <span>Consent-Protokoll</span>
                    </div>
                    <div class="table-fit">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>User-ID</th>
                                    <th>Version</th>
                                    <th>Services</th>
                                    <th>Erstellt</th>
                                    <th>Aktualisiert</th>
                                </tr>
                            </thead>
                            <tbody>
                                <f:for each="{data.consents}" as="consent">
                                    <tr>
                                        <td>
                                            <code title="{consent.identification_key}">
                                                <f:format.crop value="{consent.identification_key}" maxCharacters="12" append="..." />
                                            </code>
                                        </td>
                                        <td>{consent.banner_version}</td>
                                        <td>
                                            <ul style="margin:0; padding:0; list-style:none;">
                                                <f:for each="{consent.consent_services}" as="service">
                                                    <li>
                                                        <f:if condition="{service.consent}">
                                                            <f:then>
                                                                <core:icon identifier="actions-check" size="small" />
                                                            </f:then>
                                                            <f:else>
                                                                <core:icon identifier="actions-close" size="small" />
                                                            </f:else>
                                                        </f:if>
                                                        {service.title}
                                                    </li>
                                                </f:for>
                                            </ul>
                                        </td>
                                        <td><f:format.date format="d.m.Y H:i">{consent.crdate}</f:format.date></td>
                                        <td><f:format.date format="d.m.Y H:i">{consent.tstamp}</f:format.date></td>
                                    </tr>
                                </f:for>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </f:then>
        <f:else>
            <div class="callout callout-info">
                <h4>Keine Consent-Daten vorhanden</h4>
                <p>Es wurden noch keine Zustimmungen gespeichert.</p>
            </div>
        </f:else>
    </f:if>
</f:section>
</html>
