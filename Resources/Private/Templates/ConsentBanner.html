<html
        xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        xmlns:c="http://typo3.org/ns/Bb/Cookiebanner/ViewHelpers"
        data-namespace-typo3-fluid="true">

<f:layout name="Default"/>

<f:section name="Main">
    <!--googleoff: index-->
    <div class="bb-consentbanner {data.consentBanner.layoutType}" data-module-cb="ConsentBanner" data-nosnippet tabindex="-1"></div>
    <!--googleon: index-->
    <f:if condition="{data.consentBanner}">
        <f:if condition="{data.consentBanner.consentAccepted}">
            <f:then>
                <f:if condition="!{data.consentBanner.isTextLink}">
                    <button class="bb-widget bb-consentbanner-button" data-module-cb="ConsentBanner"></button>
                </f:if>
            </f:then>
            <f:else>
                <div class="bb-consentbanner {data.consentBanner.layoutType}" data-module-cb="ConsentBanner"></div>
            </f:else>
        </f:if>
    </f:if>
</f:section>
</html>
