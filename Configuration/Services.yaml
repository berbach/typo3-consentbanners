services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Bb\ConsentBanner\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  Bb\ConsentBanner\Controller\ManagementController:
    public: true
    tags: ['backend.controller']

  Bb\ConsentBanner\EventListener\TypoScriptModifier:
    tags:
      - name: event.listener
        identifier: 'TypoScriptModifier/NewAndEdit'
        event: TYPO3\CMS\Backend\Controller\Event\BeforeFormEnginePageInitializedEvent
      - name: event.listener
        identifier: 'TypoScriptModifier'
        event: TYPO3\CMS\Extbase\Event\Mvc\BeforeActionCallEvent
